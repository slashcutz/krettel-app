name: krettel-app
app_id: da_R4qIGtmUDA9Y
owner: slashcutz_official
package: .
env:
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: https://krettel-app.wasmer.app
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  FILESYSTEM_DISK: local
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  DB_CONNECTION: sqlite
  DB_DATABASE: /app/storage/database.sqlite
  TERABOX_REMOTE_DIR: /Apps/Krettel
  TERABOX_WEB_HOST: https://www.1024terabox.com
  PIXELDRAIN_BASE_URL: https://pixeldrain.net
  PIXELDRAIN_STREAM_MODE: redirect
  PHPIX_PHP_THREADS: '4'
volumes:
- name: storage
  mount: /app/storage
jobs:
- name: setup-migrate
  trigger: post-deployment
  action:
    execute:
      command: migrate
- name: setup-storage-link
  trigger: post-deployment
  action:
    execute:
      command: storage-link
- name: setup-seed-admin
  trigger: post-deployment
  action:
    execute:
      command: seed-admin
- name: process-queue
  trigger: '*/5 * * * *'
  action:
    execute:
      command: process-queue
kind: wasmer.io/App.v0
