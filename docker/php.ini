upload_max_filesize = 4096M
post_max_size = 4100M
max_execution_time = 0
max_input_time = 7200
memory_limit = 512M

; Keep large multipart uploads AND any sys_get_temp_dir() usage on the
; persistent storage disk, not the container's small ephemeral /tmp.
upload_tmp_dir = /var/www/html/storage/app/media-tmp
sys_temp_dir = /var/www/html/storage/app/media-tmp
