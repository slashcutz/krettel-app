# Render blueprint — deploys the Laravel app as ONE container that runs
# Nginx + PHP-FPM + FFmpeg + the queue worker together, sharing a persistent
# Disk. This keeps the locally-transcoded HLS files visible to both the worker
# (which writes them) and the web server (which streams them).
#
# Before deploying:
#   1. Connect this GitHub repo (slashcutz/krettel-app) to Render via the
#      Render Dashboard -> New -> Blueprint, or "New Web Service" -> "Docker".
#   2. Render has no managed MySQL — the app runs on SQLite stored on the
#      persistent disk (/var/www/html/storage/database.sqlite). No database
#      env vars are needed.
#   3. Set APP_URL to your app's *.onrender.com (or custom domain) URL.
#   4. Set the TERABOX_* credentials (same as your local .env).
#   5. Set PIXELDRAIN_API_KEY — required for Pixeldrain uploads/streaming AND
#      for the Pixeldrain image store (thumbnails/posters/banners/logos).
#      PIXELDRAIN_BASE_URL defaults to https://pixeldrain.net.
#   6. Recommend the `standard` plan (or higher) when you need in-container
#      HLS transcoding — the `starter`/`free` plans (512MB) can OOM while
#      ffmpeg muxes/encodes large files.
#
# Cache/queue/session all use the DATABASE driver (app defaults), so no
# separate Redis service is required.

services:
  - type: web
    name: krettel-app
    runtime: docker
    repo: https://github.com/slashcutz/krettel-app
    branch: main
    plan: standard
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    disk:
      name: krettel-storage
      mountPath: /var/www/html/storage
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      # DB-backed session / cache / queue (no Redis needed)
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # SQLite on the persistent disk (Render has no managed MySQL).
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/database.sqlite
      # TeraBox (keep in sync with your local .env)
      - key: TERABOX_EMAIL
        sync: false
      - key: TERABOX_PASSWORD
        sync: false
      - key: TERABOX_NDUS
        sync: false
      - key: TERABOX_REMOTE_DIR
        value: /Apps/Krettel
      - key: TERABOX_WEB_HOST
        value: https://www.1024terabox.com
      # Pixeldrain (keep in sync with your local .env) — needed for uploads,
      # streaming, quality variants and the Pixeldrain image store.
      - key: PIXELDRAIN_API_KEY
        sync: false
      - key: PIXELDRAIN_BASE_URL
        value: https://pixeldrain.net
      # FFMPEG_BINARY / FFPROBE_BINARY: intentionally unset — the image ships
      # ffmpeg/ffprobe on PATH, matching the config defaults.
