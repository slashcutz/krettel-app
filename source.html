<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krettel Mobile Player UI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar & Utilities */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Red Glow Effect for the Active Play Button */
    .play-glow {
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
    }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen flex justify-center items-center p-0 sm:p-4 antialiased">

  <!-- Mobile Viewport Container -->
  <div class="w-full max-w-[410px] bg-black min-h-[850px] rounded-[36px] overflow-hidden shadow-2xl border border-zinc-800 flex flex-col relative">

    <!-- ================= 1. VIDEO PLAYER SECTION ================= -->
    <div class="relative w-full aspect-[16/10] bg-black select-none group">
      
      <!-- Video Background Image -->
      <img 
        src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1000&auto=format&fit=crop" 
        alt="Cinema Scene" 
        class="w-full h-full object-cover"
      />
      
      <!-- Ambient Dark Overlay -->
      <div class="absolute inset-0 bg-black/50 backdrop-blur-[1px]"></div>

      <!-- Top Player Bar -->
      <div class="absolute top-0 left-0 right-0 p-3 flex justify-between items-center z-10">
        <button class="p-1.5 rounded-full hover:bg-white/10 text-white/90 active:scale-95 transition">
          <i data-lucide="chevron-down" class="w-6 h-6"></i>
        </button>
        <div class="flex items-center space-x-3 text-white/90">
          <button class="p-1.5 hover:bg-white/10 rounded-full transition"><i data-lucide="subtitles" class="w-4 h-4"></i></button>
          <button class="p-1.5 hover:bg-white/10 rounded-full transition"><i data-lucide="sparkles" class="w-4 h-4"></i></button>
          <button class="p-1.5 hover:bg-white/10 rounded-full transition"><i data-lucide="rotate-cw" class="w-4 h-4"></i></button>
          <button class="p-1.5 hover:bg-white/10 rounded-full transition"><i data-lucide="settings" class="w-4 h-4"></i></button>
        </div>
      </div>

      <!-- Center Playback Controls -->
      <div class="absolute inset-0 flex items-center justify-center space-x-6 z-10">
        <!-- Rewind 10s -->
        <button class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center active:scale-90 transition">
          <i data-lucide="rewind" class="w-5 h-5 fill-white text-white"></i>
        </button>

        <!-- Main Play Button -->
        <button class="w-16 h-16 rounded-full bg-red-600/90 border-2 border-red-500 flex items-center justify-center play-glow active:scale-90 transition">
          <i data-lucide="play" class="w-7 h-7 fill-white text-white ml-1"></i>
        </button>

        <!-- Fast Forward 10s -->
        <button class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center active:scale-90 transition">
          <i data-lucide="fast-forward" class="w-5 h-5 fill-white text-white"></i>
        </button>
      </div>

      <!-- Bottom Player Controls Overlay -->
      <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between z-10 text-xs">
        
        <!-- Timer Display -->
        <div class="flex flex-col text-[11px] font-medium leading-tight">
          <span class="text-red-500 font-bold">00:07</span>
          <span class="text-zinc-400">04:48</span>
        </div>

        <!-- Skip Intro Button -->
        <button class="bg-black/60 backdrop-blur-md border border-zinc-700/80 px-3 py-1.5 rounded-xl flex items-center space-x-1.5 font-semibold text-xs text-zinc-200 active:scale-95 transition">
          <i data-lucide="chevrons-right" class="w-4 h-4 text-zinc-400"></i>
          <span>Skip Intro</span>
        </button>

        <!-- Volume & Fullscreen -->
        <div class="flex items-center space-x-2">
          <i data-lucide="volume-2" class="w-4 h-4 text-zinc-300"></i>
          <div class="w-12 h-1 bg-zinc-700 rounded-full overflow-hidden">
            <div class="bg-red-600 h-full w-[60%]"></div>
          </div>
          <button class="p-1 text-zinc-300"><i data-lucide="maximize" class="w-4 h-4"></i></button>
        </div>
      </div>

      <!-- Scrubber Progress Bar -->
      <div class="absolute bottom-0 left-0 right-0 h-1 bg-zinc-800 cursor-pointer group">
        <div class="bg-red-600 h-full w-[15%] relative">
          <!-- Scrubber Dot -->
          <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-3 h-3 bg-red-600 rounded-full shadow"></div>
        </div>
      </div>

    </div>

    <!-- ================= 2. MOVIE DETAILS SECTION ================= -->
    <div class="p-4 space-y-3">
      
      <!-- Title & Action Buttons -->
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-2xl font-black tracking-tight text-white">Killer Instinct</h1>
          <!-- Metadata Bar -->
          <div class="flex items-center space-x-2 text-xs text-zinc-400 mt-1 font-medium">
            <span>2024</span>
            <span>•</span>
            <span class="bg-red-600 text-white font-bold px-1.5 py-0.2 rounded text-[10px]">18+</span>
            <span>•</span>
            <span>2h 18m</span>
            <span>•</span>
            <span class="border border-zinc-700 text-zinc-300 text-[10px] px-1 rounded font-bold">HD</span>
          </div>
        </div>

        <!-- Action Items (Watchlist, Share, Download) -->
        <div class="flex items-center space-x-4 text-zinc-400 pt-1">
          <button class="flex flex-col items-center space-y-1 hover:text-white transition">
            <i data-lucide="plus" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Watchlist</span>
          </button>
          <button class="flex flex-col items-center space-y-1 hover:text-white transition">
            <i data-lucide="share-2" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Share</span>
          </button>
          <button class="flex flex-col items-center space-y-1 hover:text-white transition">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Download</span>
          </button>
        </div>
      </div>

    </div>

    <hr class="border-zinc-900 mx-4" />

    <!-- ================= 3. CONTINUE WATCHING SECTION ================= -->
    <div class="p-4 space-y-3 flex-1">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white tracking-wide">Continue Watching</h2>
        <a href="#" class="text-xs font-semibold text-red-600 hover:underline">See All</a>
      </div>

      <!-- Horizontal Cards Rail -->
      <div class="flex space-x-3 overflow-x-auto no-scrollbar py-1">
        
        <!-- Card 1 -->
        <div class="min-w-[210px] bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-2 flex items-center space-x-3 relative overflow-hidden group cursor-pointer">
          <div class="relative w-16 h-16 rounded-xl overflow-hidden flex-shrink-0">
            <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
              <i data-lucide="play" class="w-4 h-4 fill-white text-white"></i>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-xs font-bold text-white truncate">Interstellar</h3>
            <p class="text-[11px] text-zinc-400 mt-0.5">1h 30m left</p>
            <!-- Progress Line -->
            <div class="w-full h-1 bg-zinc-800 rounded-full mt-2 overflow-hidden">
              <div class="bg-red-600 h-full w-[45%]"></div>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="min-w-[210px] bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-2 flex items-center space-x-3 relative overflow-hidden group cursor-pointer">
          <div class="relative w-16 h-16 rounded-xl overflow-hidden flex-shrink-0">
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
              <i data-lucide="play" class="w-4 h-4 fill-white text-white"></i>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-xs font-bold text-white truncate">Inception</h3>
            <p class="text-[11px] text-zinc-400 mt-0.5">45m left</p>
            <!-- Progress Line -->
            <div class="w-full h-1 bg-zinc-800 rounded-full mt-2 overflow-hidden">
              <div class="bg-red-600 h-full w-[70%]"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
